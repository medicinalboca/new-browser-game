<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Track Racer - Full Track</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin:0; overflow:hidden; background:#000; color:#0ff; font-family: 'Press Start 2P', system-ui; }
        #ui { position:absolute; top:20px; left:20px; z-index:100; text-shadow: 0 0 10px #0ff; }
        #speed { font-size:28px; }
        canvas { display:block; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="speed">SPEED: 0 km/h</div>
        <div style="margin-top:8px; font-size:13px; opacity:0.85;">WASD/Arrows • First Person • Full Track with Straights</div>
    </div>

    <script>
        // =============================================
        // LASER TRACK RACER - First Person 3D
        // Complete track with LONG STRAIGHTS + corners (apexes)
        // Using THREE.CatmullRomCurve3 (official public Three.js)
        // =============================================

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x222244, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(80, 120, 50);
        scene.add(sun);

        // === FULL TRACK: LONG STRAIGHTS + CORNERS WITH APEXES ===
        // Designed with clear high-speed straights and technical corners
        const trackPoints = [
            // Start/Finish straight (long)
            new THREE.Vector3(0, 0, -110),
            new THREE.Vector3(0, 0, -60),
            new THREE.Vector3(0, 0, -10),

            // Corner 1 (right turn apex)
            new THREE.Vector3(35, 0, 25),
            new THREE.Vector3(75, 0, 55),

            // Short straight after corner
            new THREE.Vector3(85, 0, 90),

            // Corner 2 (left turn apex)
            new THREE.Vector3(50, 0, 115),
            new THREE.Vector3(10, 0, 120),

            // Long back straight
            new THREE.Vector3(-40, 0, 115),
            new THREE.Vector3(-85, 0, 90),

            // Corner 3 (left turn apex)
            new THREE.Vector3(-95, 0, 50),
            new THREE.Vector3(-85, 0, 10),

            // Corner 4 (right turn apex)
            new THREE.Vector3(-50, 0, -30),
            new THREE.Vector3(-20, 0, -70),

            // Back to start straight
            new THREE.Vector3(0, 0, -110)
        ];

        const curve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal', 0.5);

        // Road along the curve
        const roadGeometry = new THREE.TubeGeometry(curve, 220, 17, 8, true);
        const road = new THREE.Mesh(roadGeometry, new THREE.MeshLambertMaterial({ color: 0x0a0a1f }));
        road.receiveShadow = true;
        scene.add(road);

        // Glowing laser rails
        const railMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const leftRail = new THREE.Mesh(new THREE.TubeGeometry(curve, 220, 1.1, 6, true), railMat);
        leftRail.position.y = 2;
        scene.add(leftRail);

        const rightRail = leftRail.clone();
        scene.add(rightRail);

        // Center neon dashes
        const dashMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa });
        for (let i = 0; i < 45; i++) {
            const pos = curve.getPointAt(i / 45);
            const dash = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.35, 2.8), dashMat);
            dash.position.copy(pos);
            dash.position.y = 0.55;
            scene.add(dash);
        }

        // === START / FINISH LINE ===
        const startPos = curve.getPointAt(0);
        const startFinish = new THREE.Mesh(
            new THREE.PlaneGeometry(38, 8),
            new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
        );
        startFinish.rotation.x = -Math.PI / 2;
        startFinish.position.set(startPos.x, 0.25, startPos.z);
        scene.add(startFinish);

        // Checkered pattern
        for (let i = -16; i < 17; i += 5.5) {
            const stripe = new THREE.Mesh(
                new THREE.PlaneGeometry(4.5, 8),
                new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })
            );
            stripe.rotation.x = -Math.PI / 2;
            stripe.position.set(startPos.x + i, 0.3, startPos.z);
            scene.add(stripe);
        }

        // === CAR ===
        const car = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.6, 9), new THREE.MeshLambertMaterial({ color: 0x4488ff }));
        body.position.y = 1.6;
        car.add(body);

        const glass = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.4, 3.8), new THREE.MeshLambertMaterial({ color: 0x99eeff, transparent: true, opacity: 0.45 }));
        glass.position.set(0, 2.5, -1.8);
        car.add(glass);

        scene.add(car);

        camera.position.set(0, 4.5, -4);
        car.add(camera);

        // === PHYSICS ===
        let speed = 0;
        let angle = 0;
        const MAX_SPEED = 145;
        const ACCEL = 1.15;
        const FRICTION = 0.962;
        const TURN_SPEED = 0.032;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function updatePhysics() {
            if (keys['w'] || keys['arrowup']) speed += ACCEL;
            if (keys['s'] || keys['arrowdown']) speed -= ACCEL * 0.85;

            const steerFactor = Math.max(0.35, Math.abs(speed) / 55);
            if (keys['a'] || keys['arrowleft']) angle += TURN_SPEED * steerFactor;
            if (keys['d'] || keys['arrowright']) angle -= TURN_SPEED * steerFactor;

            speed *= FRICTION;
            speed = Math.max(-40, Math.min(MAX_SPEED, speed));

            const moveX = Math.sin(angle) * speed * 0.055;
            const moveZ = Math.cos(angle) * speed * 0.055;

            car.position.x += moveX;
            car.position.z += moveZ;
            car.rotation.y = angle;

            // Track boundary
            const dist = Math.sqrt(car.position.x * car.position.x + car.position.z * car.position.z);
            if (dist > 105) {
                const s = 105 / dist;
                car.position.x *= s;
                car.position.z *= s;
                speed *= 0.55;
            }

            document.getElementById('speed').textContent = `SPEED: ${Math.abs(Math.floor(speed))} km/h`;
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        console.log('%c[Laser Track Racer] Full track with long straights + corners added!', 'color:#0ff');
    </script>
</body>
</html>
