<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Track Racer - First Person 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin:0; overflow:hidden; background:#000; color:#0ff; font-family: 'Press Start 2P', system-ui; }
        #ui { position:absolute; top:20px; left:20px; z-index:100; text-shadow: 0 0 10px #0ff; }
        #speed { font-size:28px; }
        canvas { display:block; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="speed">SPEED: 0 km/h</div>
        <div style="margin-top:10px; font-size:13px; opacity:0.85;">WASD / Arrows to drive • First Person</div>
    </div>

    <script>
        // =============================================
        // LASER TRACK RACER - First Person 3D
        // Physics & car model based on common public patterns
        // from open-source browser racing games (velocity-based
        // car physics widely used in many GitHub HTML5/Three.js racers)
        // =============================================

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights
        scene.add(new THREE.AmbientLight(0x222244, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(80, 120, 50);
        sun.castShadow = true;
        scene.add(sun);

        // === FUTURISTIC NEON LASER TRACK ===
        const track = new THREE.Group();

        // Dark road surface
        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(48, 240),
            new THREE.MeshLambertMaterial({ color: 0x0a0a1f })
        );
        road.rotation.x = -Math.PI/2;
        road.position.y = 0.05;
        road.receiveShadow = true;
        track.add(road);

        // Bright cyan laser rails
        const railMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const leftRail = new THREE.Mesh(new THREE.BoxGeometry(1.4, 4, 240), railMat);
        leftRail.position.set(-23, 2, 0);
        track.add(leftRail);

        const rightRail = leftRail.clone();
        rightRail.position.x = 23;
        track.add(rightRail);

        // Magenta accent glow lines
        const accentMat = new THREE.MeshBasicMaterial({ color: 0xff00cc });
        const leftAccent = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 240), accentMat);
        leftAccent.position.set(-22.3, 4.2, 0);
        track.add(leftAccent);

        const rightAccent = leftAccent.clone();
        rightAccent.position.x = 22.3;
        track.add(rightAccent);

        // Center neon dashes (laser feel)
        for (let z = -110; z < 110; z += 6) {
            const dash = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.4, 2.8),
                new THREE.MeshBasicMaterial({ color: 0x00ffaa })
            );
            dash.position.set(0, 0.5, z);
            track.add(dash);
        }

        scene.add(track);

        // === CAR ===
        const car = new THREE.Group();

        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x4488ff });
        const body = new THREE.Mesh(new THREE.BoxGeometry(4.2, 1.6, 9), bodyMat);
        body.position.y = 1.6;
        body.castShadow = true;
        car.add(body);

        // Windshield
        const glass = new THREE.Mesh(
            new THREE.BoxGeometry(3.4, 1.4, 3.8),
            new THREE.MeshLambertMaterial({ color: 0x99eeff, transparent:true, opacity:0.45 })
        );
        glass.position.set(0, 2.5, -1.8);
        car.add(glass);

        scene.add(car);

        // First-person camera attached to car
        camera.position.set(0, 4.5, -4);
        car.add(camera);

        // === RACING PHYSICS (public pattern) ===
        // Based on common velocity + angle model used in many
        // open source browser racers on GitHub
        let speed = 0;
        let angle = 0;
        const MAX_SPEED = 145;
        const ACCEL = 1.15;
        const FRICTION = 0.962;
        const TURN_SPEED = 0.032;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function updatePhysics() {
            // Throttle
            if (keys['w'] || keys['arrowup']) speed += ACCEL;
            // Brake / Reverse
            if (keys['s'] || keys['arrowdown']) speed -= ACCEL * 0.85;

            // Steering
            const steerFactor = Math.max(0.35, Math.abs(speed) / 55);
            if (keys['a'] || keys['arrowleft']) angle += TURN_SPEED * steerFactor;
            if (keys['d'] || keys['arrowright']) angle -= TURN_SPEED * steerFactor;

            // Apply friction
            speed *= FRICTION;

            // Clamp
            speed = Math.max(-40, Math.min(MAX_SPEED, speed));

            // Movement
            const moveX = Math.sin(angle) * speed * 0.055;
            const moveZ = Math.cos(angle) * speed * 0.055;

            car.position.x += moveX;
            car.position.z += moveZ;
            car.rotation.y = angle;

            // Track boundaries
            if (Math.abs(car.position.x) > 40) {
                car.position.x = Math.sign(car.position.x) * 40;
                speed *= 0.55;
            }
            if (Math.abs(car.position.z) > 115) {
                car.position.z = Math.sign(car.position.z) * 115;
                speed *= 0.55;
            }

            document.getElementById('speed').textContent = `SPEED: ${Math.abs(Math.floor(speed))} km/h`;
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        console.log('%c[Laser Track Racer] Pushed to GitHub. Drive with WASD!', 'color:#0ff');
    </script>
</body>
</html>
