<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street View Racer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin:0; overflow:hidden; background:#87ceeb; color:#333; font-family: system-ui; }
        #ui { position:absolute; top:20px; left:20px; z-index:100; }
        #speed { font-size:24px; font-weight:bold; }
        canvas { display:block; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="speed">SPEED: 0 km/h</div>
        <div style="margin-top:6px; font-size:13px; color:#555;">WASD / Arrows • Realistic Track</div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Natural daylight
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(100, 150, 80);
        sun.castShadow = true;
        scene.add(sun);

        // === REALISTIC TRACK (Satellite / Street View style) ===
        const trackPoints = [
            new THREE.Vector3(0, 0, -110), new THREE.Vector3(0, 0, -60), new THREE.Vector3(0, 0, -10),
            new THREE.Vector3(35, 0, 25), new THREE.Vector3(75, 0, 55),
            new THREE.Vector3(85, 0, 90),
            new THREE.Vector3(50, 0, 115), new THREE.Vector3(10, 0, 120),
            new THREE.Vector3(-40, 0, 115), new THREE.Vector3(-85, 0, 90),
            new THREE.Vector3(-95, 0, 50), new THREE.Vector3(-85, 0, 10),
            new THREE.Vector3(-50, 0, -30), new THREE.Vector3(-20, 0, -70),
            new THREE.Vector3(0, 0, -110)
        ];

        const curve = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal', 0.5);

        // Asphalt road
        const road = new THREE.Mesh(
            new THREE.TubeGeometry(curve, 220, 16, 8, true),
            new THREE.MeshLambertMaterial({ color: 0x333333 })
        );
        road.receiveShadow = true;
        scene.add(road);

        // White center line dashes (realistic road markings)
        const lineMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
        const centerDashes = [];
        for (let i = 0; i < 55; i++) {
            const dash = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 4), lineMat);
            dash.userData = { t: i / 55 };
            scene.add(dash);
            centerDashes.push(dash);
        }

        // Curbs / edges
        const curbMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
        const leftCurb = new THREE.Mesh(new THREE.TubeGeometry(curve, 220, 1.3, 6, true), curbMat);
        leftCurb.position.y = 0.8;
        scene.add(leftCurb);

        const rightCurb = leftCurb.clone();
        scene.add(rightCurb);

        // === GROUND (Grass / Terrain - Satellite view style) ===
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(400, 400),
            new THREE.MeshLambertMaterial({ color: 0x4a7c3f })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        scene.add(ground);

        // Simple trees / vegetation
        function addTree(x, z) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(1.2, 1.5, 6, 6),
                new THREE.MeshLambertMaterial({ color: 0x5c4033 })
            );
            trunk.position.set(x, 2.5, z);
            scene.add(trunk);

            const foliage = new THREE.Mesh(
                new THREE.ConeGeometry(5, 8, 6),
                new THREE.MeshLambertMaterial({ color: 0x2e5a1f })
            );
            foliage.position.set(x, 8, z);
            scene.add(foliage);
        }

        // Scatter some trees around the track
        for (let i = 0; i < 25; i++) {
            const angle = (i / 25) * Math.PI * 2;
            const radius = 70 + Math.random() * 80;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            addTree(x, z);
        }

        // Start/Finish line
        const startPos = curve.getPointAt(0);
        const startFinish = new THREE.Mesh(
            new THREE.PlaneGeometry(36, 7),
            new THREE.MeshLambertMaterial({ color: 0xffffff })
        );
        startFinish.rotation.x = -Math.PI / 2;
        startFinish.position.set(startPos.x, 0.1, startPos.z);
        scene.add(startFinish);

        // Car
        const car = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 8.5), new THREE.MeshLambertMaterial({ color: 0x3366cc }));
        body.position.y = 1.5;
        car.add(body);

        const glass = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 3.5), new THREE.MeshLambertMaterial({ color: 0x88bbff, transparent: true, opacity: 0.6 }));
        glass.position.set(0, 2.3, -1.5);
        car.add(glass);

        scene.add(car);
        camera.position.set(0, 4.2, -3.8);
        car.add(camera);

        // Physics
        let speed = 0;
        let angle = 0;
        const MAX_SPEED = 140;
        const ACCEL = 1.1;
        const FRICTION = 0.96;
        const TURN_SPEED = 0.03;

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function updatePhysics() {
            if (keys['w'] || keys['arrowup']) speed += ACCEL;
            if (keys['s'] || keys['arrowdown']) speed -= ACCEL * 0.8;

            const steerFactor = Math.max(0.4, Math.abs(speed) / 50);
            if (keys['a'] || keys['arrowleft']) angle += TURN_SPEED * steerFactor;
            if (keys['d'] || keys['arrowright']) angle -= TURN_SPEED * steerFactor;

            speed *= FRICTION;
            speed = Math.max(-35, Math.min(MAX_SPEED, speed));

            const moveX = Math.sin(angle) * speed * 0.05;
            const moveZ = Math.cos(angle) * speed * 0.05;

            car.position.x += moveX;
            car.position.z += moveZ;
            car.rotation.y = angle;

            // Keep on track
            const dist = Math.sqrt(car.position.x * car.position.x + car.position.z * car.position.z);
            if (dist > 100) {
                const s = 100 / dist;
                car.position.x *= s;
                car.position.z *= s;
                speed *= 0.5;
            }

            document.getElementById('speed').textContent = `SPEED: ${Math.abs(Math.floor(speed))} km/h`;
        }

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            updatePhysics();

            // Animated white center dashes (subtle flow)
            centerDashes.forEach(dash => {
                dash.userData.t = (dash.userData.t + 0.006) % 1;
                const pos = curve.getPointAt(dash.userData.t);
                dash.position.copy(pos);
                dash.position.y = 0.35;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        console.log('%c[Street View Racer] Realistic satellite/street view style track added!', 'color:#555');
    </script>
</body>
</html>
